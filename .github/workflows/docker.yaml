name: Docker Image Sync to Aliyun

on:
  workflow_dispatch:
  schedule:
    # 每 6 小时同步一次（UTC 20,2,8,14 = 北京时间 4,10,16,22 点）
    - cron: '0 20,2,8,14 * * *'
  push:
    branches: [ main ]
    paths:
      - 'images.txt'

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
  # 可选的其他注册表凭证（如果需要同步私有镜像）
  DOCKERHUB_USERNAME: "${{ secrets.DOCKERHUB_USERNAME }}"
  DOCKERHUB_PASSWORD: "${{ secrets.DOCKERHUB_PASSWORD }}"
  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
  GCP_SERVICE_ACCOUNT_KEY: "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}"
  AZURE_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}"
  AZURE_CLIENT_SECRET: "${{ secrets.AZURE_CLIENT_SECRET }}"
  AZURE_TENANT_ID: "${{ secrets.AZURE_TENANT_ID }}"
  AZURE_REGISTRY_NAME: "${{ secrets.AZURE_REGISTRY_NAME }}"
  AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}"
  AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
  AWS_REGION: "${{ secrets.AWS_REGION }}"

jobs:
  build:
    name: Sync Images
    runs-on: ubuntu-latest
    # 超时兜底：正常一轮 2-4 分钟；逐平台复制 + 索引重建会稍长。
    # 没有这个上限时，Docker Hub 长时间无响应会让 job 挂满 6 小时才被判失败。
    timeout-minutes: 60
    # 同一时间只允许一个同步任务：重叠运行会并发推送同一批 tag，
    # 两个 run 互相覆盖 manifest，产生难以定位的偶发失败。
    # cancel-in-progress: false —— 不打断进行中的同步，只排队等待。
    concurrency:
      group: oci-mirror-sync
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install skopeo & awscli
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo python3-pip
          pip3 install --no-cache-dir --break-system-packages awscli
          sudo rm -rf /var/lib/apt/lists/* ~/.cache/pip

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'
          build-mount-path: '/var/lib/docker/'

      - name: Restart docker
        run: sudo service docker restart

      # 说明：这里曾尝试把 skopeo 换成上游新版，以启用 --multi-arch 的“平台列表”
      # 能力（从而让带 attestation 的镜像也能保持多架构）。结论是这条路不可行：
      #   - containers/skopeo 的 GitHub release 只有源码，没有预编译二进制；
      #   - 从官方镜像 copy 出来的二进制依赖 Debian 的 libsubid.so.5，
      #     在 Ubuntu runner 上即使补装该库也无法运行。
      # 与其保留一个随时可能把同步搞挂的安装步骤，不如接受系统自带版本的限制：
      # 带 buildx attestation 的镜像会退化为“单架构 tag”，其余平台按 digest 保留。
      # 详见 README 的 Q8 / Q10。

      - name: Sync and Push to Aliyun
        id: sync_step
        run: |
          # 阿里云登录是硬依赖：一旦凭证过期/失效，下面每个镜像都会以
          # "unauthorized / denied" 失败，邮件里就会凭空多出 N 条同步失败。
          # 这里改为立即失败，让日志和邮件直接指向真正的原因。
          if ! echo "$ALIYUN_REGISTRY_PASSWORD" | docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"; then
              echo ">>> ❌ 阿里云镜像仓库登录失败：请检查 ALIYUN_REGISTRY / ALIYUN_REGISTRY_USER / ALIYUN_REGISTRY_PASSWORD 这三个 Secret"
              exit 1
          fi
          
          # 登录各注册表（失败不阻断，仅影响对应私有镜像的同步）
          # Docker Hub
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_PASSWORD}" ]; then
              echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin docker.io 2>&1 || echo ">>> ⚠️ Docker Hub 登录失败，跳过"
          fi
          
          # GitHub Container Registry
          if [ -n "${GITHUB_TOKEN}" ]; then
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u _ --password-stdin 2>&1 || echo ">>> ⚠️ ghcr.io 登录失败，跳过"
          fi
          
          # Google Container Registry
          if [ -n "${GCP_SERVICE_ACCOUNT_KEY}" ]; then
              echo "$GCP_SERVICE_ACCOUNT_KEY" | docker login gcr.io -u _json_key --password-stdin 2>&1 || echo ">>> ⚠️ gcr.io 登录失败，跳过"
          fi
          
          # Azure Container Registry
          if [ -n "${AZURE_CLIENT_ID}" ] && [ -n "${AZURE_CLIENT_SECRET}" ] && [ -n "${AZURE_TENANT_ID}" ] && [ -n "${AZURE_REGISTRY_NAME}" ]; then
              az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" 2>&1 || { echo ">>> ⚠️ Azure 登录失败，跳过"; true; }
              az acr login --name "$AZURE_REGISTRY_NAME" 2>&1 || echo ">>> ⚠️ ACR 登录失败，跳过"
          fi

          SYNC_SUMMARY=""
          SUCCESS_COUNT=0
          FAILURE_COUNT=0
          SKIPPED_COUNT=0

          # -------------------------------------------------------------------
          # 摘要比对：忽略 attestation 子清单
          # buildx 生成的 provenance/SBOM 证明清单 config 为
          # application/vnd.oci.empty.v1+json，阿里云 ACR 会拒绝该 manifest class，
          # 因此它既不能推、也不该参与"是否已一致"的判断。
          # 只比对真实平台的 image digest；空结果表示源不是标准 manifest list
          # （例如单架构索引），此时回退到 config digest 比对。
          # -------------------------------------------------------------------
          platform_fingerprint() {
              echo "$1" | jq -r '
                  [ .manifests[]?
                    | select((.platform.os // "") != "unknown")
                    | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
                    | "\(.platform.os)/\(.platform.architecture)/\(.platform.variant // ""):\(.digest)"
                  ] | sort | join("|")' 2>/dev/null || echo ""
          }

          src_fingerprint() {
              local fp=$(platform_fingerprint "$1")
              if [ -n "$fp" ]; then
                  printf '%s' "$fp"
              else
                  echo "$1" | jq -r '.config.digest // empty' 2>/dev/null || echo ""
              fi
          }

          is_up_to_date() {
              local compare_target="$1"
              local compare_raw="$2"

              local src_fp=$(src_fingerprint "$compare_raw")
              if [ -z "$src_fp" ]; then
                  return 1
              fi

              local dst_raw=$(skopeo inspect --raw "docker://$compare_target" \
                  --creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" 2>/dev/null || echo "")
              if [ -z "$dst_raw" ]; then
                  return 1
              fi

              local dst_fp=$(src_fingerprint "$dst_raw")
              if [ -n "$dst_fp" ] && [ "$src_fp" = "$dst_fp" ]; then
                  return 0
              fi

              return 1
          }

          # -------------------------------------------------------------------
          # 带重试的复制：Docker Hub 侧瞬时抖动（429/5xx/超时）很常见，
          # 失败一次就永久记为"同步失败"会污染邮件可信度。
          #
          # 注意 --all 由调用方通过 extra 参数传入，不再写死：
          # skopeo-copy(1) 明确写着 --all 的语义是"忽略 --override-os/--override-arch，
          # 复制列表里的全部镜像以及列表本身"。也就是说 --all 与平台选择互斥
          # —— 逐平台复制时若带 --all，仍然会把 attestation 子清单一并推上去，
          # 白白重现被阿里云拒绝的原错误（实测日志：override 成 linux/amd64 后
          # 依然打印 "copying image 2/4 from manifest list"）。
          # -------------------------------------------------------------------
          retry_copy() {
              local src="$1"
              local dst="$2"
              local dest_creds="$3"
              local max_attempts="$4"
              shift 4
              local attempt=1
              while [ "$attempt" -le "$max_attempts" ]; do
                  if skopeo copy "docker://$src" "$dst" --dest-creds "$dest_creds" "$@" 2>&1; then
                      return 0
                  fi
                  echo ">>> ↻ 第 ${attempt}/${max_attempts} 次尝试失败"
                  attempt=$((attempt + 1))
                  [ "$attempt" -le "$max_attempts" ] && sleep 10
              done
              return 1
          }

          # -------------------------------------------------------------------
          # 把源清单里的 attestation 子清单剔除，保留多架构结构
          # -------------------------------------------------------------------
          strip_attestations() {
              echo "$1" | jq -c '
                  .manifests |= [ .[]?
                      | select((.platform.os // "") != "unknown")
                      | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
                  ]' 2>/dev/null || echo ""
          }

          # -------------------------------------------------------------------
          # attestation 镜像的复制策略，两级：
          #
          #   a) `--multi-arch <精确平台列表>`：skopeo-copy(1) 中该选项
          #      "Copy only specific platforms"，只有列出的平台会被推上去，
          #      attestation 子清单天然被排除；产出的是完整（非 sparse）
          #      manifest list —— 既是多架构，又不含 application/vnd.oci.empty.v1+json。
          #   b) 兜底：逐个平台单独推（`--override-os/--override-arch`），
          #      tag 最终指向其中一个平台，其余平台按 digest 并存。
          #
          # 为什么不用"改写后的 index 再整份复制"：过滤后的 index 只存在于本地，
          # 其子清单仍在远端 registry，skopeo 无法用本地 oci: 引用去远端取子清单，
          # 那样必然 manifest unknown。
          #
          # 为什么不用 `--multi-arch index-only`：它会生成 sparse manifest list，
          # 实测阿里云返回 `blob unknown to registry` 而拒绝（文档也提示 sparse list
          # 通常需要子 manifest 已可解析）。完整列表这条路更可靠。
          # -------------------------------------------------------------------
          copy_per_platform() {
              local index_json="$1"
              local src_ref="$2"
              local dst="$3"
              local dest_creds="$4"

              # 输出三列：os / arch / variant。variant 可能为空，read 会折叠连续空白，
              # 字段不会错位（注意别写成只读两列，否则 variant/digest 会串位）。
              local plats
              plats=$(echo "$index_json" | jq -r '
                  .manifests[]?
                  | select((.platform.os // "") != "unknown")
                  | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
                  | "\(.platform.os) \(.platform.architecture) \(.platform.variant // "")"' 2>/dev/null || echo "")

              if [ -z "$plats" ]; then
                  echo ">>> 未在清单中找到可用平台"
                  return 1
              fi

              local plat_count=0
              local available=0
              local plat_list=""
              local os arch variant
              while IFS=' ' read -r os arch variant; do
                  [ -z "$os" ] && continue
                  if [ -n "$plat_list" ]; then
                      plat_list="${plat_list},${os}/${arch}"
                  else
                      plat_list="${os}/${arch}"
                  fi
                  plat_count=$((plat_count + 1))
              done <<< "$plats"

              # a) 精确平台列表复制。
              # 注意 runner 上的 skopeo 版本可能较老：--strip-removed-platforms 是较新
              # 版本才有的选项（实测 ubuntu-latest 报 unknown flag），--remove-list-signatures
              # 也未必存在。因此按"选项最全 → 逐步退化"依次尝试，避免因版本差异直接失败。
              # a) 多架构重建（尽力而为）。
              #    首选 --multi-arch <平台列表>：只复制列出的平台，attestation 子清单
              #    天然被排除，产出完整（非 sparse）manifest list —— 这正是
              #    "多架构 + 不含空描述符"的正解。
              #    但 ubuntu-latest 自带的 skopeo 1.13.3 不支持平台列表
              #    （只接受 system/all/index-only），所以这一步会失败，
              #    然后落到下面的逐个平台推送。升级 skopeo 的路已试过且不可行，
              #    详见下方步骤区的说明。
              #    不再尝试 `--all --format v2s2`：实测该版本处理 attestation 时
              #    会直接报 unsupported image-specific operation on artifact，
              #    属于必然失败的死路，留着只会刷屏。
              local rebuild_err=""
              if [ "$plat_count" -gt 0 ] && [ -n "$plat_list" ]; then
                  echo ">>> 多架构重建: --multi-arch ${plat_list}"
                  if rebuild_err=$(skopeo copy --multi-arch "$plat_list" --strip-removed-platforms \
                          --remove-list-signatures \
                          "docker://$src_ref" "$dst" --dest-creds "$dest_creds" 2>&1); then
                      echo ">>> ✓ 目标端已恢复为多架构清单（不含 attestation）"
                      return 0
                  fi
                  echo ">>> ↻ 当前 skopeo 不支持平台列表，最后一行: $(printf '%s' "$rebuild_err" | tail -n 1)"
                  echo ">>> ⚠️ 回退到逐个平台推送（tag 将指向单个平台，其余平台按 digest 保留）"
              fi

              # b) 兜底：逐个平台单独推
              while IFS=' ' read -r os arch variant; do
                  [ -z "$os" ] && continue
                  echo ">>> 按平台推送: ${os}/${arch}${variant:+/$variant}"
                  if ! retry_copy "$src_ref" "$dst" "$dest_creds" 3 \
                          --override-os "$os" --override-arch "$arch" ${variant:+--override-variant "$variant"}; then
                      echo ">>> ✗ 平台 ${os}/${arch} 推送失败"
                      return 1
                  fi
                  available=$((available + 1))
              done <<< "$plats"

              echo ">>> ⚠️ 目标端为单架构 tag（各平台仍可按 digest 拉取），可用平台数: ${available}"
              return 0
          }

          # -------------------------------------------------------------------
          # 复制策略：
          #   1) 原样整份复制（单次尝试，快速失败）—— 不含 attestation 的镜像走这里，
          #      保留完整的 manifest list。
          #   2) 逐平台复制 + 索引重建（每平台带 3 次重试）—— 源 index 里含 buildx
          #      attestation 时触发，因为阿里云 ACR 拒绝 application/vnd.oci.empty.v1+json。
          #   策略 1 只试一次是有意的：对 attestation 镜像重试 3 次纯属浪费
          #   （每次失败都要走完一遍 manifest 上传），真正的瞬时抖动由逐平台的重试兜住。
          # -------------------------------------------------------------------
          copy_image() {
              local src_ref="$1"
              local dst="$2"
              local dest_creds="$3"
              local src_raw="$4"

              echo ">>> 策略 1/2: 整份复制（含全部子清单）"
              if retry_copy "$src_ref" "$dst" "$dest_creds" 1 --all; then
                  return 0
              fi

              local filtered
              filtered=$(strip_attestations "$src_raw")
              local real_plats=0
              if [ -n "$filtered" ]; then
                  real_plats=$(echo "$filtered" | jq -r '.manifests | length' 2>/dev/null || echo 0)
              fi

              if [ "${real_plats:-0}" -gt 0 ]; then
                  echo ">>> 策略 2/2: 逐平台复制（${real_plats} 个平台，剔除 attestation 子清单）"
                  if copy_per_platform "$filtered" "$src_ref" "$dst" "$dest_creds"; then
                      return 0
                  fi
              else
                  echo ">>> 源不是多平台清单，无平台级降级可用"
              fi

              return 1
          }

          while IFS= read -r line || [ -n "$line" ]; do
              # 跳过空行和以 # 开头的注释行
              [[ -z "$line" ]] || [[ "$line" =~ ^\s*# ]] && continue
              
              # 取每行第一个字段作为镜像地址（支持行尾注释）
              raw_image=$(echo "$line" | awk '{print $1}')
              # 去除 @sha256:... 摘要后缀
              full_image="${raw_image%%@*}"
              # 源引用：保留用户写死的 digest（若未写则等于 full_image）
              if [[ "$raw_image" == *"@"* ]]; then
                  src_ref="${full_image}@${raw_image##*@}"
              else
                  src_ref="$full_image"
              fi
              
              # -------------------------------------------------------------------
              # 阿里云 ACR 仓库名不支持多级路径（如 sengokucola/maibot），
              # 须将 / 替换为 _：sengokucola/maibot → sengokucola_maibot
              # -------------------------------------------------------------------
              if [[ "$full_image" == *"/"* ]]; then
                  repo_name="${full_image//\//_}"
              else
                  repo_name="library_${full_image}"
              fi
              target_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$repo_name"

              # 比较源和目标是否一致，避免重复同步浮动 tag
              # 多架构: 比较各平台 image digest（忽略 attestation）；单架构: 比较 config digest
              raw=$(skopeo inspect --raw "docker://$src_ref" 2>/dev/null || echo "")
              if is_up_to_date "$target_image" "$raw"; then
                  echo ">>> Skip (digest 一致): $full_image"
                  SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
                  continue
              fi

              # 对需要认证的源 registry 做 docker login（skopeo 会读取 ~/.docker/config.json）
              # Amazon ECR
              if [[ "$full_image" == *"dkr.ecr."*".amazonaws.com"* ]] && [ -n "${AWS_ACCESS_KEY_ID}" ] && [ -n "${AWS_SECRET_ACCESS_KEY}" ] && [ -n "${AWS_REGION}" ]; then
                  ecr_registry=$(echo "$full_image" | cut -d'/' -f1)
                  aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ecr_registry" 2>/dev/null
              fi

              # 使用 skopeo copy 直接在两个 registry 间复制（保留所有平台，不占本地磁盘）
              echo ">>> Syncing: $full_image → $target_image"
              if copy_image "$src_ref" "docker://$target_image" "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" "$raw"; then
                  SYNC_SUMMARY="${SYNC_SUMMARY}\n✅ ${full_image}"
                  SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
              else
                  SYNC_SUMMARY="${SYNC_SUMMARY}\n❌ ${full_image} (同步失败)"
                  FAILURE_COUNT=$((FAILURE_COUNT + 1))
              fi
          done < images.txt

          # 写入环境变量供后续步骤使用
          {
            echo "SUCCESS_COUNT=$SUCCESS_COUNT"
            echo "FAILURE_COUNT=$FAILURE_COUNT"
            echo "SKIPPED_COUNT=$SKIPPED_COUNT"
          } >> "$GITHUB_ENV"
          {
            echo 'SYNC_RESULT<<SYNC_RESULT_EOF'
            echo -e "$SYNC_SUMMARY"
            echo 'SYNC_RESULT_EOF'
          } >> "$GITHUB_ENV"

      # 只读状态转储：把阿里云上每个目标 tag 的实际形态打印到日志，
      # 便于确认"多架构清单 / 单架构"而不用去猜。失败不影响同步结果。
      - name: 转储阿里云目标端状态
        if: always()
        run: |
          echo ">>> skopeo 版本（决定可用选项）"
          skopeo --version || true
          echo ">>> 阿里云目标端状态（不打印任何凭证）"
          while IFS= read -r line || [ -n "$line" ]; do
              [[ -z "$line" ]] || [[ "$line" =~ ^\s*# ]] && continue
              raw_image=$(echo "$line" | awk '{print $1}')
              full_image="${raw_image%%@*}"
              if [[ "$full_image" == *"/"* ]]; then
                  repo_name="${full_image//\//_}"
              else
                  repo_name="library_${full_image}"
              fi
              target="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$repo_name"
              echo "──────── $target"
              raw=$(skopeo inspect --raw "docker://$target" --creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" 2>/dev/null || echo "")
              if [ -z "$raw" ]; then
                  echo "   (无法读取)"
                  continue
              fi
              mt=$(echo "$raw" | jq -r '.mediaType // "?"' 2>/dev/null)
              n=$(echo "$raw" | jq -r '.manifests | length' 2>/dev/null || echo 0)
              echo "   mediaType: $mt"
              if [ "${n:-0}" -gt 0 ] 2>/dev/null; then
                  echo "   形态: 多架构（$n 个平台）"
                  echo "$raw" | jq -r '.manifests[]? | "     \(.platform.os)/\(.platform.architecture)\(if .platform.variant then "/" + .platform.variant else "" end): \(.digest)"' 2>/dev/null
              else
                  echo "   形态: 单架构（tag 指向单个 manifest）"
              fi
          done < images.txt

      - name: 发送 Email 通知
        if: always()
        env:
          SUCCESS_COUNT: ${{ env.SUCCESS_COUNT }}
          SKIPPED_COUNT: ${{ env.SKIPPED_COUNT }}
          FAILURE_COUNT: ${{ env.FAILURE_COUNT }}
          SYNC_RESULT: ${{ env.SYNC_RESULT }}
        run: |
          # 注意：这里必须用 shell 变量（$VAR），不能用 ${{ env.VAR }}。
          # 前者在运行时展开，能看到本步骤 env: 从 GITHUB_ENV 取到的真实计数；
          # 后者在 workflow 解析期展开，此时 env 上下文里根本没有这些键（恒为空），
          # 原来的 `env.FAILURE_COUNT > 0` 因此永远为假，主题恒不可信。
          SUCCESS_COUNT="${SUCCESS_COUNT:-0}"
          SKIPPED_COUNT="${SKIPPED_COUNT:-0}"
          FAILURE_COUNT="${FAILURE_COUNT:-0}"

          if [ "$FAILURE_COUNT" -gt 0 ] && [ "$SUCCESS_COUNT" -gt 0 ]; then
            SUBJECT="⚠️ AliCR镜像同步部分失败 (成功 ${SUCCESS_COUNT} / 失败 ${FAILURE_COUNT})"
          elif [ "$FAILURE_COUNT" -gt 0 ]; then
            SUBJECT="❌ AliCR镜像同步失败 (失败 ${FAILURE_COUNT})"
          elif [ "$SUCCESS_COUNT" -gt 0 ]; then
            SUBJECT="✅ AliCR镜像同步成功 (${SUCCESS_COUNT} 个)"
          else
            SUBJECT="☕ 同步任务完成 (无新镜像)"
          fi

          DETAIL_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf '%s\n\n%s\n\n%s\n\n%s\n\n%s\n\n%s' \
            "阿里云镜像同步报告" \
            "━━━━━━━━━━━━━━━━━━" \
            "统计: 成功 ${SUCCESS_COUNT} | 跳过 ${SKIPPED_COUNT} | 失败 ${FAILURE_COUNT}" \
            "详细结果: ${SYNC_RESULT:-无}" \
            "" \
            "查看详情: ${DETAIL_URL}")
          echo ">>> 邮件主题: $SUBJECT"

          # --fail-with-body: Resend 返回 4xx/5xx 时让 curl 退出码非 0 并打印错误体，
          # 避免"邮件根本没发出去"被 -s 静默吞掉。
          if ! curl -sS --fail-with-body -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg from "${{ secrets.RESEND_SENDER_EMAIL }}" \
              --arg to "${{ secrets.EMAIL_RECIPIENT }}" \
              --arg subject "$SUBJECT" \
              --arg body "$BODY" \
              '{from: $from, to: [$to], subject: $subject, text: $body}')"; then
            echo ">>> ⚠️ 邮件发送失败（不影响镜像同步结果）"
          fi

