name: Docker Image Sync to Aliyun

on:
  workflow_dispatch:
  schedule:
    # 每 6 小时同步一次（UTC 20,2,8,14 = 北京时间 4,10,16,22 点）
    - cron: '0 20,2,8,14 * * *'
  push:
    branches: [ main ]
    paths:
      - 'images.txt'

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
  # 可选的其他注册表凭证（如果需要同步私有镜像）
  DOCKERHUB_USERNAME: "${{ secrets.DOCKERHUB_USERNAME }}"
  DOCKERHUB_PASSWORD: "${{ secrets.DOCKERHUB_PASSWORD }}"
  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
  GCP_SERVICE_ACCOUNT_KEY: "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}"
  AZURE_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}"
  AZURE_CLIENT_SECRET: "${{ secrets.AZURE_CLIENT_SECRET }}"
  AZURE_TENANT_ID: "${{ secrets.AZURE_TENANT_ID }}"
  AZURE_REGISTRY_NAME: "${{ secrets.AZURE_REGISTRY_NAME }}"
  AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}"
  AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
  AWS_REGION: "${{ secrets.AWS_REGION }}"

jobs:
  build:
    name: Sync Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install skopeo & awscli
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo python3-pip
          pip3 install --no-cache-dir --break-system-packages awscli
          sudo rm -rf /var/lib/apt/lists/* ~/.cache/pip

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'
          build-mount-path: '/var/lib/docker/'

      - name: Restart docker
        run: sudo service docker restart

      - name: Sync and Push to Aliyun
        id: sync_step
        run: |
          echo "$ALIYUN_REGISTRY_PASSWORD" | docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"
          
          # 登录各注册表（失败不阻断，仅影响对应私有镜像的同步）
          # Docker Hub
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_PASSWORD}" ]; then
              echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin docker.io 2>&1 || echo ">>> ⚠️ Docker Hub 登录失败，跳过"
          fi
          
          # GitHub Container Registry
          if [ -n "${GITHUB_TOKEN}" ]; then
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u _ --password-stdin 2>&1 || echo ">>> ⚠️ ghcr.io 登录失败，跳过"
          fi
          
          # Google Container Registry
          if [ -n "${GCP_SERVICE_ACCOUNT_KEY}" ]; then
              echo "$GCP_SERVICE_ACCOUNT_KEY" | docker login gcr.io -u _json_key --password-stdin 2>&1 || echo ">>> ⚠️ gcr.io 登录失败，跳过"
          fi
          
          # Azure Container Registry
          if [ -n "${AZURE_CLIENT_ID}" ] && [ -n "${AZURE_CLIENT_SECRET}" ] && [ -n "${AZURE_TENANT_ID}" ] && [ -n "${AZURE_REGISTRY_NAME}" ]; then
              az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" 2>&1 || { echo ">>> ⚠️ Azure 登录失败，跳过"; true; }
              az acr login --name "$AZURE_REGISTRY_NAME" 2>&1 || echo ">>> ⚠️ ACR 登录失败，跳过"
          fi

          SYNC_SUMMARY=""
          SUCCESS_COUNT=0
          FAILURE_COUNT=0
          SKIPPED_COUNT=0

          is_up_to_date() {
              local compare_target="$1"
              local compare_raw="$2"
              local compare_is_list="$3"

              if [[ "$compare_is_list" == *"manifest.list"* ]] || [[ "$compare_is_list" == *"index"* ]]; then
                  local src_fp=$(echo "$compare_raw" | jq '[.manifests[]?.digest] | sort | join("|")' -r 2>/dev/null || echo "")
                  if [ -n "$src_fp" ] && skopeo inspect "docker://$compare_target" --creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" > /dev/null 2>&1; then
                      local dst_raw=$(skopeo inspect --raw "docker://$compare_target" --creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" 2>/dev/null || echo "")
                      local dst_fp=$(echo "$dst_raw" | jq '[.manifests[]?.digest] | sort | join("|")' -r 2>/dev/null || echo "")
                      if [ -n "$dst_fp" ] && [ "$src_fp" = "$dst_fp" ]; then
                          return 0
                      fi
                  fi
              else
                  local src_digest=$(echo "$compare_raw" | jq -r '.config.digest // empty' 2>/dev/null || echo "")
                  if [ -n "$src_digest" ] && skopeo inspect "docker://$compare_target" --creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" > /dev/null 2>&1; then
                      local dst_raw=$(skopeo inspect --raw "docker://$compare_target" --creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" 2>/dev/null || echo "")
                      local dst_digest=$(echo "$dst_raw" | jq -r '.config.digest // empty' 2>/dev/null || echo "")
                      if [ -n "$dst_digest" ] && [ "$src_digest" = "$dst_digest" ]; then
                          return 0
                      fi
                  fi
              fi

              return 1
          }

          while IFS= read -r line || [ -n "$line" ]; do
              # 跳过空行和以 # 开头的注释行
              [[ -z "$line" ]] || [[ "$line" =~ ^\s*# ]] && continue
              
              # 取每行第一个字段作为镜像地址（支持行尾注释）
              raw_image=$(echo "$line" | awk '{print $1}')
              # 去除 @sha256:... 摘要后缀
              full_image="${raw_image%%@*}"
              
              # -------------------------------------------------------------------
              # 阿里云 ACR 仓库名不支持多级路径（如 sengokucola/maibot），
              # 须将 / 替换为 _：sengokucola/maibot → sengokucola_maibot
              # -------------------------------------------------------------------
              if [[ "$full_image" == *"/"* ]]; then
                  repo_name="${full_image//\//_}"
              else
                  repo_name="library_${full_image}"
              fi
              target_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$repo_name"

              # 比较源和目标是否一致，避免重复同步浮动 tag
              # 多架构: 比较 manifest list 中各平台 digest（内容寻址，不受 JSON 重序列化影响）
              # 单架构: 直接比较 image digest
              raw=$(skopeo inspect --raw "docker://$full_image" 2>/dev/null || echo "")
              is_list=$(echo "$raw" | jq -r '.mediaType // ""' 2>/dev/null || echo "")
              if is_up_to_date "$target_image" "$raw" "$is_list"; then
                  echo ">>> Skip (digest 一致): $full_image"
                  SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
                  continue
              fi

              # 对需要认证的源 registry 做 docker login（skopeo 会读取 ~/.docker/config.json）
              # Amazon ECR
              if [[ "$full_image" == *"dkr.ecr."*".amazonaws.com"* ]] && [ -n "${AWS_ACCESS_KEY_ID}" ] && [ -n "${AWS_SECRET_ACCESS_KEY}" ] && [ -n "${AWS_REGION}" ]; then
                  ecr_registry=$(echo "$full_image" | cut -d'/' -f1)
                  aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ecr_registry" 2>/dev/null
              fi

              # 使用 skopeo copy 直接在两个 registry 间复制（保留所有平台，不占本地磁盘）
              echo ">>> Syncing: $full_image → $target_image"
              if skopeo copy --all "docker://$full_image" "docker://$target_image" --dest-creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD"; then
                  SYNC_SUMMARY="${SYNC_SUMMARY}\n✅ ${full_image}"
                  SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
              else
                  SYNC_SUMMARY="${SYNC_SUMMARY}\n❌ ${full_image} (同步失败)"
                  FAILURE_COUNT=$((FAILURE_COUNT + 1))
              fi
          done < images.txt

          # 写入环境变量供后续步骤使用
          echo "SUCCESS_COUNT=$SUCCESS_COUNT" >> $GITHUB_ENV
          echo "FAILURE_COUNT=$FAILURE_COUNT" >> $GITHUB_ENV
          echo "SKIPPED_COUNT=$SKIPPED_COUNT" >> $GITHUB_ENV
          {
            echo 'SYNC_RESULT<<EOF'
            echo -e "$SYNC_SUMMARY"
            echo 'EOF'
          } >> $GITHUB_ENV

      - name: 发送 Email 通知
        if: always()
        run: |
          printf -v SUBJECT '%s' "${{ (env.FAILURE_COUNT > 0 && '❌ AliCR镜像同步失败') ||
                                       (env.SUCCESS_COUNT > 0 && '✅ AliCR镜像同步成功') ||
                                       '☕ 同步任务完成 (无新镜像)' }}"
          printf -v DETAIL_URL '%s' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf '%s\n\n%s\n\n%s\n\n%s' \
            "阿里云镜像同步报告" \
            "━━━━━━━━━━━━━━━━━━" \
            "统计: 成功 ${SUCCESS_COUNT:-0} | 跳过 ${SKIPPED_COUNT:-0} | 失败 ${FAILURE_COUNT:-0}" \
            "详细结果: ${SYNC_RESULT:-无}" \
            "" \
            "查看详情: ${DETAIL_URL}")
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg from "${{ secrets.RESEND_SENDER_EMAIL }}" \
              --arg to "${{ secrets.EMAIL_RECIPIENT }}" \
              --arg subject "$SUBJECT" \
              --arg body "$BODY" \
              '{from: $from, to: [$to], subject: $subject, text: $body}')"

